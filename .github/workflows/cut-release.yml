name: Cut Release

# Manual bypass for cutting a release: pushing a git tag and creating a
# GitHub Release from a sandboxed session goes through this repo's local
# git proxy, which rejects tag pushes and has no release-creation API
# available. Actions' own GITHUB_TOKEN has contents:write on this repo, so
# triggering this workflow (workflow_dispatch, e.g. via the GitHub API/MCP
# actions_run_trigger) does both from inside Actions instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (e.g. 0.6.1) - must match package.json's current version"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match requested version (${{ inputs.version }})"
            exit 1
          fi

      - name: Extract this version's CHANGELOG section
        run: |
          awk -v ver="${{ inputs.version }}" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for [${{ inputs.version }}]"
            exit 1
          fi

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md
